[package]
name = "symphonia-play"
description = "Project Symphonia audio player demo application."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
publish = false
default-run = "symphonia-play"
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
exp-video-codecs = ["symphonia/exp-video-codecs"]
exp-subtitle-codecs = ["symphonia/exp-subtitle-codecs"]

# Enable experimental features since symphonia-play is a development tool.
default = ["exp-subtitle-codecs", "exp-video-codecs"]

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
lazy_static = { workspace = true }
lexopt = "0.3.2"
log = { workspace = true, features = ["release_max_level_info"] }
regex-lite = "0.1.9"
symphonia = { version = "0.6.1", path = "../symphonia", features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.5.0"
libpulse-simple-binding = "2.5.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"
rb = "0.4.1"
rubato = "5.0.1"

[lints]
workspace = true
